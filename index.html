<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>기온에 따른 자전거 대여량 비선형회귀 프로그램</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="container">
    <header>
      <h1>기온에 따른 자전거 대여량 비선형회귀 프로그램</h1>
      <p>2차 비선형회귀식을 이용한 자전거 대여량 예측</p>
    </header>

    <section class="card">
      <h2>1. 기온 입력</h2>
      <div class="input-row">
        <input id="temperature" type="number" step="0.1" value="20" placeholder="기온(℃)">
        <button id="predictBtn">예측하기</button>
      </div>
      <div id="prediction" class="result">기온을 입력하고 예측하기를 눌러주세요.</div>
    </section>

    <section class="card">
      <h2>2. 비선형회귀 분석 결과</h2>
      <div class="stats">
        <div class="stat">
          <span class="label">회귀식</span>
          <strong id="equation">계산 중...</strong>
        </div>
        <div class="stat">
          <span class="label">R²</span>
          <strong id="r2">계산 중...</strong>
        </div>
        <div class="stat">
          <span class="label">데이터 수</span>
          <strong id="dataCount">18개</strong>
        </div>
      </div>
    </section>

    <section class="card">
      <h2>3. 산점도 및 비선형 회귀곡선</h2>
      <div class="chart-wrap">
        <canvas id="regressionChart"></canvas>
      </div>
    </section>

    <section class="card">
      <h2>4. 사용 데이터</h2>
      <p class="note">프로그램 제작을 위해 사용한 예제 데이터입니다.</p>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>번호</th><th>기온(℃)</th><th>자전거 대여량(대)</th></tr>
          </thead>
          <tbody id="dataTable"></tbody>
        </table>
      </div>
    </section>

    <footer>
      <p>※ 본 프로그램은 비선형회귀 학습 및 과제 제작을 위한 예제 프로그램입니다.</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
